<svg xmlns="http://www.w3.org/2000/svg" width="940" height="586" viewBox="0 0 940 586" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="mRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c23c3c"/>
    </marker>
  </defs>
  <rect width="940" height="586" fill="#ffffff"/>

  <text x="470" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3038">图 3 · 链路整体成功率随 LLM 决策次数衰减</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" fill="#6b7280">假设单步决策正确率 98%：链路整体成功率 = 0.98ⁿ（示意，真实系统不可直接套用）</text>

  <!-- highlight band: multi-skill typical range n=10..22 -->
  <rect x="398" y="90" width="345.6" height="370" fill="#e05555" opacity="0.055"/>

  <!-- grid -->
  <g stroke="#e8eaed" stroke-width="1">
    <line x1="110" y1="90" x2="830" y2="90"/>
    <line x1="110" y1="164" x2="830" y2="164"/>
    <line x1="110" y1="238" x2="830" y2="238"/>
    <line x1="110" y1="312" x2="830" y2="312"/>
    <line x1="110" y1="386" x2="830" y2="386"/>
    <line x1="254" y1="90" x2="254" y2="460"/>
    <line x1="398" y1="90" x2="398" y2="460"/>
    <line x1="542" y1="90" x2="542" y2="460"/>
    <line x1="686" y1="90" x2="686" y2="460"/>
    <line x1="830" y1="90" x2="830" y2="460"/>
  </g>

  <!-- band label -->
  <text x="570" y="110" text-anchor="middle" font-size="11" fill="#c05656">多 Skill 方案典型区间（10～20+ 次决策）</text>
  <text x="118" y="104" font-size="10" fill="#a0a4ab">纵轴从 50% 起，便于观察</text>

  <!-- axes -->
  <line x1="110" y1="90" x2="110" y2="460" stroke="#4b5158" stroke-width="1.5"/>
  <line x1="110" y1="460" x2="830" y2="460" stroke="#4b5158" stroke-width="1.5"/>
  <g font-size="11" fill="#4b5158" text-anchor="end">
    <text x="100" y="94">100%</text>
    <text x="100" y="168">90%</text>
    <text x="100" y="242">80%</text>
    <text x="100" y="316">70%</text>
    <text x="100" y="390">60%</text>
  </g>
  <g font-size="11" fill="#4b5158" text-anchor="middle">
    <text x="110" y="478">0</text>
    <text x="254" y="478">5</text>
    <text x="398" y="478">10</text>
    <text x="542" y="478">15</text>
    <text x="686" y="478">20</text>
    <text x="830" y="478">25</text>
  </g>
  <text x="470" y="502" text-anchor="middle" font-size="11.5" fill="#4b5158">LLM 决策次数 n</text>
  <text transform="rotate(-90 48 275)" x="48" y="275" text-anchor="middle" font-size="11.5" fill="#4b5158">链路整体成功率</text>

  <!-- code reference line -->
  <line x1="110" y1="90" x2="830" y2="90" stroke="#3d9970" stroke-width="2.5"/>
  <text x="830" y="79" text-anchor="end" font-size="12" font-weight="bold" fill="#2a7a55">代码固定流程：100%（可测试、不随步骤衰减）</text>

  <!-- decay curve 0.98^n -->
  <path d="M110,90 L138.8,104.7 L167.6,119.3 L196.4,133.5 L225.2,147.4 L254,161.1 L282.8,174.5 L311.6,187.6 L340.4,200.5 L369.2,213.1 L398,225.3 L426.8,237.5 L455.6,249.3 L484.4,260.9 L513.2,272.3 L542,283.4 L570.8,294.4 L599.6,305.1 L628.4,315.6 L657.2,325.9 L686,336 L714.8,345.8 L743.6,355.5 L772.4,365 L801.2,374.3 L830,383.4" fill="none" stroke="#e05555" stroke-width="3"/>

  <!-- gap indicator at n=20 -->
  <line x1="686" y1="97" x2="686" y2="328" stroke="#c23c3c" stroke-width="1.3" stroke-dasharray="5,4" marker-start="url(#mRed)" marker-end="url(#mRed)"/>
  <text x="696" y="200" font-size="11" fill="#c23c3c">与代码流程相比</text>
  <text x="696" y="216" font-size="11" fill="#c23c3c">差 ≈33 个百分点</text>

  <!-- marked points -->
  <circle cx="167.6" cy="119.3" r="5" fill="#ffffff" stroke="#e05555" stroke-width="2.5"/>
  <text x="182" y="115" font-size="12" font-weight="bold" fill="#a33c3c">2 次 ≈ 96%</text>
  <circle cx="398" cy="225.3" r="5" fill="#ffffff" stroke="#e05555" stroke-width="2.5"/>
  <text x="412" y="221" font-size="12" font-weight="bold" fill="#a33c3c">10 次 ≈ 82%</text>
  <circle cx="686" cy="336" r="5" fill="#ffffff" stroke="#e05555" stroke-width="2.5"/>
  <text x="686" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#a33c3c">20 次 ≈ 67%</text>

  <text x="470" y="542" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c3038">每增加一个不必要的 LLM 决策点，就增加一个新的失败点</text>
  <text x="470" y="564" text-anchor="middle" font-size="11" fill="#6b7280">单步 98% 看似很高，失败率却被决策次数指数放大（0.98ⁿ，示意）</text>
</svg>
