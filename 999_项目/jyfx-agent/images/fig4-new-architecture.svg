<svg xmlns="http://www.w3.org/2000/svg" width="940" height="775" viewBox="0 0 940 775" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="mDark4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5158"/>
    </marker>
    <marker id="mGray4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8f98"/>
    </marker>
    <marker id="mGreen4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a7a55"/>
    </marker>
  </defs>
  <rect width="940" height="775" fill="#ffffff"/>

  <text x="470" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3038">图 4 · 轻量 Agent 新架构：LLM 判断层 / 确定性代码层</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" fill="#6b7280">一个场景 Skill + 少量业务 Tool ｜ 红色 = LLM 判断，灰色 = 确定性代码，绿色 = 结果数据</text>

  <!-- ===== LLM zone ===== -->
  <rect x="40" y="70" width="860" height="318" rx="10" fill="#fdf4f4" stroke="#f0dcdc"/>
  <rect x="60" y="84" width="214" height="24" rx="12" fill="#e05555"/>
  <text x="167" y="100" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM 判断层 · 仅 2～3 次调用</text>
  <text x="884" y="100" text-anchor="end" font-size="11" fill="#c05656">需要智能：分析、判断、解释</text>

  <rect x="400" y="92" width="140" height="34" rx="17" fill="#3b4048"/>
  <text x="470" y="113" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">用户</text>
  <line x1="470" y1="126" x2="470" y2="145" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark4)"/>
  <text x="482" y="140" font-size="10.5" fill="#6b7280">发起请求</text>

  <rect x="390" y="150" width="160" height="34" rx="6" fill="#e05555"/>
  <text x="470" y="171" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">LLM ①（Agent）</text>
  <line x1="470" y1="184" x2="470" y2="203" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark4)"/>
  <text x="482" y="198" font-size="10.5" fill="#6b7280">load todo_recommend（仅一次）</text>

  <rect x="330" y="208" width="280" height="40" rx="6" fill="#fbe3bd" stroke="#d9a441"/>
  <text x="470" y="224" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#6b4d1a">todo_recommend 场景 Skill</text>
  <text x="470" y="240" text-anchor="middle" font-size="10" fill="#8a6a33">分析什么 · 判断问题 · 排优先级 · 解释原因</text>
  <line x1="470" y1="248" x2="470" y2="267" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark4)"/>
  <text x="482" y="262" font-size="10.5" fill="#6b7280">注入场景分析方法</text>

  <rect x="390" y="272" width="160" height="34" rx="6" fill="#e05555"/>
  <text x="470" y="293" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">LLM ②（判断与决策）</text>

  <g fill="none" stroke="#7a828c" stroke-width="1.3">
    <path d="M470,306 V316 H280 V326" marker-end="url(#mDark4)"/>
    <path d="M470,306 V316 H490 V326" marker-end="url(#mDark4)"/>
    <path d="M470,306 V316 H680 V326" marker-end="url(#mDark4)"/>
  </g>

  <rect x="170" y="330" width="220" height="36" rx="6" fill="#ffffff" stroke="#3b4048" stroke-width="1.6"/>
  <text x="280" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3038">get_manager_business_data</text>
  <rect x="400" y="330" width="180" height="36" rx="6" fill="#ffffff" stroke="#3b4048" stroke-width="1.6"/>
  <text x="490" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3038">recommend_todos</text>
  <rect x="590" y="330" width="180" height="36" rx="6" fill="#ffffff" stroke="#3b4048" stroke-width="1.6"/>
  <text x="680" y="352" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3038">final_todo_card</text>
  <text x="470" y="384" text-anchor="middle" font-size="10" fill="#6b7280">业务级 Tool：表达 Agent 需要的业务能力</text>

  <!-- card -->
  <text x="849" y="132" text-anchor="middle" font-size="10" fill="#6b7280">返回卡片</text>
  <path d="M770,348 H784 V158 H794" fill="none" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark4)"/>
  <rect x="798" y="140" width="102" height="36" rx="6" fill="#3d9970"/>
  <text x="849" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">经营待办卡片</text>
  <text x="884" y="380" text-anchor="end" font-size="11" font-weight="bold" fill="#c05656">全程仅 2～3 次 LLM 调用</text>

  <!-- ===== boundary ===== -->
  <line x1="40" y1="405" x2="900" y2="405" stroke="#4b5158" stroke-width="1.5" stroke-dasharray="8,6"/>
  <rect x="300" y="392" width="340" height="26" rx="13" fill="#ffffff" stroke="#4b5158" stroke-width="1.2"/>
  <text x="470" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3038">确定性边界：判断在上，执行在下</text>

  <!-- ===== deterministic zone ===== -->
  <rect x="40" y="418" width="860" height="312" rx="10" fill="#f5f6f8" stroke="#dfe2e7"/>
  <rect x="60" y="432" width="240" height="24" rx="12" fill="#4b5158"/>
  <text x="180" y="448" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">确定性代码层 · 可测试、结果确定</text>
  <text x="884" y="448" text-anchor="end" font-size="11" fill="#56707f">零 LLM 决策</text>

  <rect x="170" y="468" width="600" height="240" rx="8" fill="#ffffff" stroke="#aeb4bd" stroke-width="1.4"/>
  <text x="470" y="490" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c3038">后端代码 —— get_manager_business_data 的内部实现</text>
  <text x="750" y="490" text-anchor="end" font-size="10" fill="#8a8f98">（实际约 7 个接口，示意 4 个）</text>

  <rect x="390" y="502" width="160" height="30" rx="4" fill="#d7dbe1" stroke="#aeb4bd"/>
  <text x="470" y="521" text-anchor="middle" font-size="11" fill="#373c44">Tool 入口（参数校验）</text>

  <g fill="none" stroke="#8a8f98" stroke-width="1.2">
    <path d="M470,532 V546 H275 V556" marker-end="url(#mGray4)"/>
    <path d="M470,532 V546 H405 V556" marker-end="url(#mGray4)"/>
    <path d="M470,532 V546 H535 V556" marker-end="url(#mGray4)"/>
    <path d="M470,532 V546 H665 V556" marker-end="url(#mGray4)"/>
  </g>

  <rect x="225" y="560" width="100" height="34" rx="4" fill="#eef0f3" stroke="#b7bdc6" stroke-dasharray="5,3"/>
  <text x="275" y="581" text-anchor="middle" font-size="10.5" fill="#6b7280">接口 A</text>
  <rect x="355" y="560" width="100" height="34" rx="4" fill="#eef0f3" stroke="#b7bdc6" stroke-dasharray="5,3"/>
  <text x="405" y="581" text-anchor="middle" font-size="10.5" fill="#6b7280">接口 B</text>
  <rect x="485" y="560" width="100" height="34" rx="4" fill="#eef0f3" stroke="#b7bdc6" stroke-dasharray="5,3"/>
  <text x="535" y="581" text-anchor="middle" font-size="10.5" fill="#6b7280">接口 C</text>
  <rect x="615" y="560" width="100" height="34" rx="4" fill="#eef0f3" stroke="#b7bdc6" stroke-dasharray="5,3"/>
  <text x="665" y="581" text-anchor="middle" font-size="10.5" fill="#6b7280">接口 D</text>
  <text x="727" y="574" font-size="10" font-style="italic" fill="#8a8f98">对 Agent</text>
  <text x="727" y="588" font-size="10" font-style="italic" fill="#8a8f98">不可见</text>

  <g stroke="#8a8f98" stroke-width="1.2">
    <line x1="275" y1="594" x2="424" y2="622" marker-end="url(#mGray4)"/>
    <line x1="405" y1="594" x2="451" y2="622" marker-end="url(#mGray4)"/>
    <line x1="535" y1="594" x2="505" y2="622" marker-end="url(#mGray4)"/>
    <line x1="665" y1="594" x2="532" y2="622" marker-end="url(#mGray4)"/>
  </g>

  <rect x="350" y="626" width="240" height="32" rx="4" fill="#d7dbe1" stroke="#aeb4bd"/>
  <text x="470" y="646" text-anchor="middle" font-size="11.5" fill="#373c44">数据聚合 / 指标计算</text>

  <line x1="470" y1="658" x2="470" y2="665" stroke="#2a7a55" stroke-width="1.3" marker-end="url(#mGreen4)"/>
  <rect x="390" y="668" width="160" height="30" rx="15" fill="#e3f2ec" stroke="#3d9970"/>
  <text x="470" y="687" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a6b4f">结构化业务数据</text>

  <!-- data return path -->
  <path d="M390,683 H130 V348 H165" fill="none" stroke="#2a7a55" stroke-width="1.6" marker-end="url(#mGreen4)"/>
  <text transform="rotate(-90 118 516)" x="118" y="516" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#2a7a55">结构化业务数据回流（跨边界）</text>

  <text x="470" y="754" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c3038">Tool 表达业务能力，接口细节被分层屏蔽 —— 正常的软件分层</text>
</svg>
