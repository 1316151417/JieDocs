<svg xmlns="http://www.w3.org/2000/svg" width="940" height="668" viewBox="0 0 940 668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="mDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5158"/>
    </marker>
  </defs>
  <rect width="940" height="668" fill="#ffffff"/>

  <text x="470" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#2c3038">图 2 · 同一个确定性流程的两种实现</text>
  <text x="470" y="54" text-anchor="middle" font-size="11.5" fill="#6b7280">流程完全相同：调用 A → B → C → 合并数据 → 计算指标；唯一区别是——谁来驱动</text>

  <!-- ===== top panel: multi-skill ===== -->
  <rect x="40" y="72" width="860" height="262" rx="10" fill="#fdf4f4" stroke="#f0d8d8"/>
  <rect x="60" y="86" width="232" height="26" rx="13" fill="#e05555"/>
  <text x="176" y="103" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">多 Skill 实现：LLM 逐步驱动</text>
  <text x="880" y="104" text-anchor="end" font-size="13" font-weight="bold" fill="#c23c3c">LLM 决策点 ×8+（每步都可能出错）</text>

  <!-- row 1 -->
  <g>
    <rect x="70" y="136" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="114" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="174" y="136" width="88" height="34" rx="5" fill="#eef0f3" stroke="#c9cdd4"/>
    <text x="218" y="157" text-anchor="middle" font-size="11" fill="#4b5158">load Skill A</text>
    <rect x="278" y="136" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="322" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="382" y="136" width="88" height="34" rx="5" fill="#d7dbe1" stroke="#aeb4bd"/>
    <text x="426" y="157" text-anchor="middle" font-size="11" fill="#373c44">调用 A</text>
    <rect x="486" y="136" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="530" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="590" y="136" width="88" height="34" rx="5" fill="#eef0f3" stroke="#c9cdd4"/>
    <text x="634" y="157" text-anchor="middle" font-size="11" fill="#4b5158">load Skill B</text>
    <rect x="694" y="136" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="738" y="157" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="798" y="136" width="88" height="34" rx="5" fill="#d7dbe1" stroke="#aeb4bd"/>
    <text x="842" y="157" text-anchor="middle" font-size="11" fill="#373c44">调用 B</text>
  </g>
  <g stroke="#7a828c" stroke-width="1.3">
    <line x1="158" y1="153" x2="168" y2="153" marker-end="url(#mDark)"/>
    <line x1="262" y1="153" x2="272" y2="153" marker-end="url(#mDark)"/>
    <line x1="366" y1="153" x2="376" y2="153" marker-end="url(#mDark)"/>
    <line x1="470" y1="153" x2="480" y2="153" marker-end="url(#mDark)"/>
    <line x1="574" y1="153" x2="584" y2="153" marker-end="url(#mDark)"/>
    <line x1="678" y1="153" x2="688" y2="153" marker-end="url(#mDark)"/>
    <line x1="782" y1="153" x2="792" y2="153" marker-end="url(#mDark)"/>
  </g>
  <!-- snake connector to row 2 -->
  <line x1="842" y1="170" x2="842" y2="210" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark)"/>

  <!-- row 2 (right to left) -->
  <g>
    <rect x="70" y="216" width="88" height="34" rx="5" fill="#d7dbe1" stroke="#aeb4bd"/>
    <text x="114" y="237" text-anchor="middle" font-size="11" fill="#373c44">计算指标</text>
    <rect x="174" y="216" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="218" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="278" y="216" width="88" height="34" rx="5" fill="#d7dbe1" stroke="#aeb4bd"/>
    <text x="322" y="237" text-anchor="middle" font-size="11" fill="#373c44">合并数据</text>
    <rect x="382" y="216" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="426" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="486" y="216" width="88" height="34" rx="5" fill="#d7dbe1" stroke="#aeb4bd"/>
    <text x="530" y="237" text-anchor="middle" font-size="11" fill="#373c44">调用 C</text>
    <rect x="590" y="216" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="634" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
    <rect x="694" y="216" width="88" height="34" rx="5" fill="#eef0f3" stroke="#c9cdd4"/>
    <text x="738" y="237" text-anchor="middle" font-size="11" fill="#4b5158">load Skill C</text>
    <rect x="798" y="216" width="88" height="34" rx="5" fill="#e05555"/>
    <text x="842" y="237" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">LLM</text>
  </g>
  <g stroke="#7a828c" stroke-width="1.3">
    <line x1="798" y1="233" x2="788" y2="233" marker-end="url(#mDark)"/>
    <line x1="694" y1="233" x2="684" y2="233" marker-end="url(#mDark)"/>
    <line x1="590" y1="233" x2="580" y2="233" marker-end="url(#mDark)"/>
    <line x1="486" y1="233" x2="476" y2="233" marker-end="url(#mDark)"/>
    <line x1="382" y1="233" x2="372" y2="233" marker-end="url(#mDark)"/>
    <line x1="278" y1="233" x2="268" y2="233" marker-end="url(#mDark)"/>
    <line x1="174" y1="233" x2="164" y2="233" marker-end="url(#mDark)"/>
  </g>
  <text x="470" y="312" text-anchor="middle" font-size="11" font-style="italic" fill="#b05252">每次执行，LLM 都要把完全相同的步骤重新『决定』一遍 —— 增加的是调用次数与失败点，不是智能价值</text>

  <!-- ===== divider chip ===== -->
  <rect x="320" y="344" width="300" height="26" rx="13" fill="#2c3038"/>
  <text x="470" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">同一个流程，唯一区别：谁来驱动</text>

  <!-- ===== bottom panel: business tool ===== -->
  <rect x="40" y="378" width="860" height="246" rx="10" fill="#f5f6f8" stroke="#dfe2e7"/>
  <rect x="60" y="392" width="262" height="26" rx="13" fill="#4b5158"/>
  <text x="191" y="409" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#ffffff">新方案：Business Tool 一次驱动</text>
  <text x="880" y="410" text-anchor="end" font-size="13" font-weight="bold" fill="#2a7a55">LLM 决策点 ×0（流程内）</text>

  <rect x="66" y="486" width="140" height="36" rx="6" fill="#ffffff" stroke="#3b4048" stroke-width="1.6"/>
  <text x="136" y="508" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2c3038">Agent 调用一次</text>
  <line x1="210" y1="504" x2="230" y2="504" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark)"/>

  <rect x="236" y="446" width="560" height="120" rx="8" fill="#ffffff" stroke="#3b4048" stroke-width="1.6"/>
  <text x="516" y="470" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2c3038">Business Tool：经营数据处理（固定流程）</text>

  <g>
    <rect x="290" y="486" width="60" height="40" rx="4" fill="#eef0f3" stroke="#aeb4bd"/>
    <text x="320" y="510" text-anchor="middle" font-size="11" fill="#373c44">接口 A</text>
    <rect x="372" y="486" width="60" height="40" rx="4" fill="#eef0f3" stroke="#aeb4bd"/>
    <text x="402" y="510" text-anchor="middle" font-size="11" fill="#373c44">接口 B</text>
    <rect x="454" y="486" width="60" height="40" rx="4" fill="#eef0f3" stroke="#aeb4bd"/>
    <text x="484" y="510" text-anchor="middle" font-size="11" fill="#373c44">接口 C</text>
    <rect x="536" y="486" width="86" height="40" rx="4" fill="#eef0f3" stroke="#aeb4bd"/>
    <text x="579" y="510" text-anchor="middle" font-size="11" fill="#373c44">数据聚合</text>
    <rect x="644" y="486" width="86" height="40" rx="4" fill="#eef0f3" stroke="#aeb4bd"/>
    <text x="687" y="510" text-anchor="middle" font-size="11" fill="#373c44">指标计算</text>
  </g>
  <g stroke="#7a828c" stroke-width="1.2">
    <line x1="350" y1="506" x2="366" y2="506" marker-end="url(#mDark)"/>
    <line x1="432" y1="506" x2="448" y2="506" marker-end="url(#mDark)"/>
    <line x1="514" y1="506" x2="530" y2="506" marker-end="url(#mDark)"/>
    <line x1="622" y1="506" x2="638" y2="506" marker-end="url(#mDark)"/>
  </g>
  <text x="516" y="550" text-anchor="middle" font-size="10.5" fill="#6b7280">顺序固定 ｜ 可单元测试 ｜ 结果确定</text>

  <line x1="796" y1="506" x2="814" y2="506" stroke="#7a828c" stroke-width="1.3" marker-end="url(#mDark)"/>
  <rect x="820" y="488" width="72" height="36" rx="6" fill="#3d9970"/>
  <text x="856" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">结构化结果</text>

  <text x="470" y="604" text-anchor="middle" font-size="11" font-style="italic" fill="#56707f">同样跑 1000 次：上面每次多烧 8+ 次 LLM 调用，这里零额外调用，输出完全一致</text>

  <text x="470" y="650" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2c3038">执行 1000 次结果都一样的步骤，不应该让 LLM 每次重新决定</text>
</svg>
